name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching package.json (for example, v1.1.0)
        required: true
        type: string
      draft:
        description: Create the GitHub release as a draft
        required: false
        default: false
        type: boolean
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: false
        default: false
        type: boolean
      hotpatch:
        description: Replace assets on this version tag with a same-version hotpatch
        required: false
        default: false
        type: boolean
      hotpatch_revision:
        description: Increasing hotpatch revision (for example, 1)
        required: false
        default: "0"
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      draft: ${{ steps.release.outputs.draft }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      hotpatch: ${{ steps.release.outputs.hotpatch }}
      hotpatch_revision: ${{ steps.release.outputs.hotpatch_revision }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate version and release options
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRAFT: ${{ inputs.draft }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_HOTPATCH: ${{ inputs.hotpatch }}
          INPUT_HOTPATCH_REVISION: ${{ inputs.hotpatch_revision }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          packaged_revision="$(node -p "require('./package.json').hotpatchRevision || 0")"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
            draft="$INPUT_DRAFT"
            prerelease="$INPUT_PRERELEASE"
            hotpatch="$INPUT_HOTPATCH"
            if [[ "$hotpatch" == "true" ]]; then
              hotpatch_revision="$INPUT_HOTPATCH_REVISION"
            else
              hotpatch_revision="$packaged_revision"
            fi
          else
            draft="false"
            if [[ "$REF_NAME" =~ ^v${version}-hotpatch\.([0-9]+)$ ]]; then
              tag="v$version"
              prerelease="false"
              hotpatch="true"
              hotpatch_revision="${BASH_REMATCH[1]}"
            else
              tag="$REF_NAME"
              hotpatch="false"
              hotpatch_revision="$packaged_revision"
              if [[ "$tag" == *-* ]]; then
                prerelease="true"
              else
                prerelease="false"
              fi
            fi
          fi

          if [[ "$tag" != "v$version" ]]; then
            echo "::error::Release tag '$tag' must match package.json version '$version' as v$version."
            exit 1
          fi

          if [[ ! "$hotpatch_revision" =~ ^[0-9]+$ ]]; then
            echo "::error::Hotpatch revision '$hotpatch_revision' must be a non-negative integer."
            exit 1
          fi
          if [[ "$hotpatch" == "true" && "$hotpatch_revision" -lt 1 ]]; then
            echo "::error::A hotpatch release requires a revision of at least 1."
            exit 1
          fi
          if [[ "$EVENT_NAME" != "workflow_dispatch" && "$hotpatch" == "true" && "$hotpatch_revision" != "$packaged_revision" ]]; then
            echo "::error::Hotpatch tag revision '$hotpatch_revision' must match package.json revision '$packaged_revision'."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "hotpatch=$hotpatch" >> "$GITHUB_OUTPUT"
          echo "hotpatch_revision=$hotpatch_revision" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, test, and build
        run: npm run verify

  build:
    name: Build ${{ matrix.label }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            platform: windows-x64
            windows_arch: x64
            script: package:win:x64
            assets: |
              release/*-x64.exe
              release/*-x64.exe.blockmap
              release/latest.yml
              release/latest-x64.yml
          - label: Windows ARM64
            os: windows-latest
            platform: windows-arm64
            windows_arch: arm64
            script: package:win:arm64
            assets: |
              release/*-arm64.exe
              release/*-arm64.exe.blockmap
              release/latest-arm64.yml
          - label: macOS
            os: macos-latest
            platform: macos
            script: package:mac
            assets: |
              release/*.dmg
              release/*.zip
              release/latest-mac.yml
              release/*.blockmap
          - label: Linux
            os: ubuntu-latest
            platform: linux
            script: package:linux
            assets: |
              release/*.AppImage
              release/*.deb
              release/*.pacman
              release/latest-linux.yml
              release/*.blockmap
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux package tooling
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install --yes libarchive-tools

      - name: Stamp hotpatch revision into package
        run: node .github/stamp-hotpatch.cjs package ${{ needs.verify.outputs.hotpatch_revision }}

      - name: Configure Windows certificate signing
        if: startsWith(matrix.platform, 'windows-')
        shell: bash
        env:
          SIGNING_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          if [[ -n "$SIGNING_LINK" ]]; then
            printf 'CSC_LINK=%s\n' "$SIGNING_LINK" >> "$GITHUB_ENV"
            printf 'CSC_KEY_PASSWORD=%s\n' "$SIGNING_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "No Windows signing certificate configured; building unsigned packages."
          fi

      - name: Configure macOS certificate signing
        if: matrix.platform == 'macos'
        shell: bash
        env:
          SIGNING_LINK: ${{ secrets.MACOS_CSC_LINK }}
          SIGNING_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
        run: |
          if [[ -n "$SIGNING_LINK" ]]; then
            printf 'CSC_LINK=%s\n' "$SIGNING_LINK" >> "$GITHUB_ENV"
            printf 'CSC_KEY_PASSWORD=%s\n' "$SIGNING_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "No macOS signing certificate configured; building unsigned packages."
          fi

      - name: Build native packages
        run: npm run ${{ matrix.script }}

      - name: Verify Windows package payload
        if: startsWith(matrix.platform, 'windows-')
        shell: pwsh
        env:
          WINDOWS_ARCH: ${{ matrix.windows_arch }}
        run: |
          $unpacked = if ($env:WINDOWS_ARCH -eq 'arm64') { 'release/win-arm64-unpacked' } else { 'release/win-unpacked' }
          $required = @(
            "$unpacked/Typesetly.exe",
            "$unpacked/resources/app.asar",
            "$unpacked/ffmpeg.dll",
            "$unpacked/libEGL.dll"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing required $env:WINDOWS_ARCH package payload: $path"
            }
          }

          $executableBytes = [IO.File]::ReadAllBytes("$unpacked/Typesetly.exe")
          $peOffset = [BitConverter]::ToInt32($executableBytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($executableBytes, $peOffset + 4)
          $expectedMachine = if ($env:WINDOWS_ARCH -eq 'arm64') { 0xAA64 } else { 0x8664 }
          if ($machine -ne $expectedMachine) {
            throw "Typesetly.exe has PE machine 0x$($machine.ToString('X4')); expected 0x$($expectedMachine.ToString('X4')) for $env:WINDOWS_ARCH."
          }

          $setup = Get-Item "release/Typesetly-Setup-*-$env:WINDOWS_ARCH.exe"
          $portable = Get-Item "release/Typesetly-Portable-*-$env:WINDOWS_ARCH.exe"
          foreach ($package in @($setup, $portable)) {
            # Force the embedded payload format. Without -t7z, some runner
            # versions identify only the outer NSIS executable.
            $listing = (& 7z l -slt -t7z $package.FullName) -join "`n"
            if ($listing -notmatch 'Typesetly\.exe' -or $listing -notmatch 'ffmpeg\.dll') {
              throw "$($package.Name) does not contain a complete application payload."
            }

            # electron-builder 26.15.3 allowed 7-Zip to select BCJ2/ARM64
            # filters that NSIS could list but could not extract at install time.
            # The result was an apparently successful install containing only
            # the uninstaller. 26.15.6 pins the embedded application archive to
            # the NSIS-compatible single-stream BCJ filter.
            $archiveMethod = ($listing -split "`r?`n" | Where-Object { $_ -match '^Method = \S' } | Select-Object -First 1)
            if ($archiveMethod -notmatch '\bBCJ\b' -or $archiveMethod -match '\bBCJ2\b|\bARM64\b') {
              throw "$($package.Name) uses an NSIS-incompatible payload method: $archiveMethod"
            }
          }

          # Both architecture-specific installers must perform a real extraction.
          # The ARM64 application cannot launch on this x64 runner, but its NSIS
          # bootstrapper can still install the ARM payload for structural QA.
          $qaInstall = Join-Path $env:RUNNER_TEMP "typesetly-$env:WINDOWS_ARCH-install"
          $installer = Start-Process -FilePath $setup.FullName -ArgumentList '/S', "/D=$qaInstall" -Wait -PassThru
          if ($installer.ExitCode -ne 0) {
            throw "$($setup.Name) exited with code $($installer.ExitCode)."
          }
          foreach ($relativePath in @('Typesetly.exe', 'resources/app.asar', 'ffmpeg.dll', 'libEGL.dll')) {
            $installedPath = Join-Path $qaInstall $relativePath
            if (-not (Test-Path -LiteralPath $installedPath -PathType Leaf)) {
              throw "Installed payload is missing $relativePath for $env:WINDOWS_ARCH."
            }
          }

          $uninstaller = Join-Path $qaInstall 'Uninstall Typesetly.exe'
          if (Test-Path -LiteralPath $uninstaller -PathType Leaf) {
            Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait
          }
          if (Test-Path -LiteralPath $qaInstall) {
            Remove-Item -LiteralPath $qaInstall -Recurse -Force
          }

      - name: Verify Linux distribution packages
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          for pattern in 'release/*.AppImage' 'release/*.deb' 'release/*.pacman'; do
            mapfile -t packages < <(compgen -G "$pattern" || true)
            if [[ "${#packages[@]}" -ne 1 || ! -s "${packages[0]}" ]]; then
              echo "::error::Expected one non-empty Linux package matching $pattern."
              exit 1
            fi
          done

          tar -tf release/*.pacman > "$RUNNER_TEMP/typesetly-pacman-files.txt"
          grep -Eq '(^|/)opt/Typesetly/' "$RUNNER_TEMP/typesetly-pacman-files.txt" || {
            echo '::error::The Arch/CachyOS package does not contain the Typesetly application payload.'
            exit 1
          }

      - name: Stamp hotpatch revision into updater metadata
        run: node .github/stamp-hotpatch.cjs metadata ${{ needs.verify.outputs.hotpatch_revision }} release/latest.yml release/latest-x64.yml release/latest-arm64.yml release/latest-mac.yml release/latest-linux.yml

      - name: Upload native packages
        uses: actions/upload-artifact@v7
        with:
          name: typesetly-${{ matrix.platform }}-${{ needs.verify.outputs.version }}
          path: ${{ matrix.assets }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish GitHub release
    needs:
      - verify
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download native packages
        uses: actions/download-artifact@v8
        with:
          pattern: typesetly-*-${{ needs.verify.outputs.version }}
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd release-assets
          mapfile -t files < <(find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | sort)

          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "::error::No packaged applications were downloaded."
            exit 1
          fi

          sha256sum "${files[@]}" > SHA256SUMS.txt

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_DRAFT: ${{ needs.verify.outputs.draft }}
          RELEASE_PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          RELEASE_HOTPATCH: ${{ needs.verify.outputs.hotpatch }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            obsolete_windows_assets=(
              "Typesetly-Setup-$RELEASE_VERSION.exe"
              "Typesetly-Setup-$RELEASE_VERSION.exe.blockmap"
              "Typesetly-Portable-$RELEASE_VERSION.exe"
            )
            for asset in "${obsolete_windows_assets[@]}"; do
              gh release delete-asset "$RELEASE_TAG" "$asset" \
                --repo "$GITHUB_REPOSITORY" \
                --yes >/dev/null 2>&1 || true
            done
            gh release upload "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            exit 0
          fi

          if [[ "$RELEASE_HOTPATCH" == "true" ]]; then
            echo "::error::Hotpatches can only replace assets on an existing release."
            exit 1
          fi

          release_flags=(
            --repo "$GITHUB_REPOSITORY"
            --title "Typesetly $RELEASE_VERSION"
            --target "$GITHUB_SHA"
            --generate-notes
          )

          if [[ "$RELEASE_DRAFT" == "true" ]]; then
            release_flags+=(--draft)
          fi

          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            release_flags+=(--prerelease)
          fi

          gh release create "$RELEASE_TAG" release-assets/* "${release_flags[@]}"
